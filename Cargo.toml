[package]
name = "look-away"
version = "0.1.0"
edition = "2024"
description = "Eye-break reminders for Omarchy and Hyprland"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"
